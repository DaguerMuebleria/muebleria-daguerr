<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muebleria DAGUERR</title>
    <style>
        /* Estilos generales y reseteo basico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fdfbf7;
            color: #333;
            overflow-x: hidden;
        }

        /* Franja superior decorativa */
        .top-banner-line {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #c0392b, #d35400);
        }

        /* Contenedor principal del encabezado con overflow visible para evitar cortes */
        .header-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 25px 20px;
            overflow: visible !important;
        }

        /* Ubicacion / subtitulo superior */
        .location-subtitle {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #c0392b;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Titulo de la marca con animacion limpia y espacio corregido para la G */
        .brand-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #1a1a1a;
            text-transform: uppercase;
            line-height: 1.6; 
            padding-top: 15px;
            padding-bottom: 15px;
            overflow: visible !important;
            display: inline-block;
            animation: fadeInClean 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animacion de entrada limpia sin destellos ni recuadros */
        @keyframes fadeInClean {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Seccion de catalogo */
        .catalog-header {
            text-align: center;
            margin-top: 15px;
        }

        .catalog-subtitle {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #b8860b;
            text-transform: uppercase;
            font-weight: bold;
        }

        .catalog-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 6px;
            color: #1a1a1a;
        }

        /* Contenedor de productos de ejemplo */
        .products-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 20px;
            flex-wrap: wrap;
        }

        .product-card {
            background: #ffffff;
            border-radius: 8px;
            width: 300px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="top-banner-line"></div>

    <header class="header-container">
        <div class="location-subtitle">— San Buenaventura, Coahuila —</div>
        
        <!-- Titulo DAGUERR corregido (espacio para la G) y con animacion limpia -->
        <h1 class="brand-title">DAGUERR</h1>
        
        <div class="catalog-header">
            <span class="catalog-subtitle">Catalogo Completo</span>
            <h2 class="catalog-title">Encuentra lo que tu hogar necesita</h2>
        </div>
    </header>

    <main>
        <section class="products-grid">
            <div class="product-card">
                <p>Lavadora Automatica</p>
            </div>
            <div class="product-card">
                <p>Centro de Lavado</p>
            </div>
            <div class="product-card">
                <p>Lavadora Carga Superior</p>
            </div>
        </section>
    </main>

</body>
</html>
