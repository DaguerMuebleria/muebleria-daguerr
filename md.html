  <script>

    const SUPABASE_URL = 'https://sbuwwydygabgweegvzoi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidXd3eWR5Z2FiZ3dlZWd2em9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODgxOTksImV4cCI6MjEwMTM2NDE5OX0.D3iSUhyNx4CpB5xTqsfn4R5CFvyghpfzVvi_CxdnXPI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let productos = [];
    let productoActual = null;
    let indiceImagenActual = 0;
    let categoriaActiva = 'Todos';
    let subcategoriaActiva = null;
    let terminoBusqueda = '';
    let carrito = [];

    // ============================================================
    // FUNCIÓN PARA LIMPIAR MENSAJE DE CARACTERES ESPECIALES Y URLs
    // ============================================================
    function limpiarMensajeWhatsApp(mensaje) {
        // Eliminar asteriscos (negritas)
        mensaje = mensaje.replace(/\*/g, '');
        // Eliminar guiones bajos
        mensaje = mensaje.replace(/_/g, '');
        // Eliminar backticks
        mensaje = mensaje.replace(/`/g, '');
        // Eliminar pipes
        mensaje = mensaje.replace(/\|/g, '');
        // Eliminar corchetes
        mensaje = mensaje.replace(/\[/g, '');
        mensaje = mensaje.replace(/\]/g, '');
        // Eliminar llaves
        mensaje = mensaje.replace(/\{/g, '');
        mensaje = mensaje.replace(/\}/g, '');
        // Eliminar URLs de imágenes (http, https)
        mensaje = mensaje.replace(/https?:\/\/[^\s]+/g, '');
        // Eliminar múltiples saltos de línea
        mensaje = mensaje.replace(/\n{3,}/g, '\n\n');
        // Eliminar espacios al inicio y final
        mensaje = mensaje.trim();
        return mensaje;
    }

    // ============================================================
    // FUNCIÓN PARA ABRIR WHATSAPP (COMPATIBLE CON PC Y MÓVIL)
    // ============================================================
    function abrirWhatsApp(numero, mensaje) {
        let num = numero.replace(/\D/g, '');
        
        if (num.length === 10) {
            num = '52' + num;
        }
        
        if (num.length < 10) {
            alert('❌ El número debe tener al menos 10 dígitos. Ejemplo: 521234567890');
            return false;
        }

        // Limpiar el mensaje de caracteres especiales y URLs
        mensaje = limpiarMensajeWhatsApp(mensaje);

        const url = `https://wa.me/${num}?text=${encodeURIComponent(mensaje)}`;
        
        try {
            const ventana = window.open(url, '_blank');
            if (!ventana || ventana.closed || typeof ventana.closed === 'undefined') {
                const enlace = document.createElement('a');
                enlace.href = url;
                enlace.target = '_blank';
                enlace.rel = 'noopener noreferrer';
                enlace.style.display = 'none';
                document.body.appendChild(enlace);
                enlace.click();
                document.body.removeChild(enlace);
            }
            return true;
        } catch (e) {
            alert('❌ No se pudo abrir WhatsApp automáticamente.\n\n' +
                  'Por favor, copia este enlace y pégalo en tu navegador:\n\n' + url);
            return false;
        }
    }

    // ============================================================
    // ENVIAR WHATSAPP - PRODUCTO INDIVIDUAL
    // ============================================================
    function enviarWhatsAppProducto() {
        if (!productoActual) {
            alert('No hay producto seleccionado.');
            return;
        }

        const telefono = prompt(
            '📱 Ingresa el número de WhatsApp del cliente:\n\n' +
            'Ejemplo: 521234567890 (México)\n' +
            'Ejemplo: 56987654321 (Chile)',
            '521234567890'
        );
        
        if (!telefono) return;

        let mensaje = 'Mueblería Daguerr - Cotización\n\n';
        mensaje += 'Articulo: ' + (productoActual.titulo || 'Sin título') + '\n\n';
        
        if (productoActual.descripcion) {
            mensaje += 'Caracteristicas:\n' + productoActual.descripcion + '\n\n';
        }

        mensaje += 'Precios y Planes:\n';
        mensaje += 'Contado: ' + formatearPrecioWhatsApp(productoActual.precio_contado) + '\n';
        
        if (productoActual.pago_mes_2) {
            mensaje += '2 Meses: ' + formatearPrecioWhatsApp(productoActual.pago_mes_2) + ' /mes (Enganche: ' + formatearPrecioWhatsApp(productoActual.enganche_2) + ')\n';
        }
        if (productoActual.pago_mes_3) {
            mensaje += '3 Meses: ' + formatearPrecioWhatsApp(productoActual.pago_mes_3) + ' /mes (Enganche: ' + formatearPrecioWhatsApp(productoActual.enganche_3) + ')\n';
        }
        if (productoActual.pago_mes_6) {
            mensaje += '6 Meses: ' + formatearPrecioWhatsApp(productoActual.pago_mes_6) + ' /mes (Enganche: ' + formatearPrecioWhatsApp(productoActual.enganche_6) + ')\n';
        }
        if (productoActual.pago_tarjeta_12) {
            mensaje += '12 Meses (Tarjeta): ' + formatearPrecioWhatsApp(productoActual.pago_tarjeta_12) + '\n';
        }

        mensaje += '\nGracias por su preferencia! Mueblería Daguerr.';

        abrirWhatsApp(telefono, mensaje);
    }

    // ============================================================
    // ENVIAR WHATSAPP - CARRITO COMPLETO
    // ============================================================
    function enviarWhatsAppCarrito() {
        if (carrito.length === 0) {
            alert('🛒 El carrito está vacío. Agrega artículos primero.');
            return;
        }

        const telefono = prompt(
            '📱 Ingresa el número de WhatsApp del cliente:\n\n' +
            'Ejemplo: 521234567890 (México)\n' +
            'Ejemplo: 56987654321 (Chile)',
            '521234567890'
        );
        
        if (!telefono) return;

        let mensaje = 'Mueblería Daguerr - Cotización de Múltiples Artículos\n\n';
        mensaje += 'Artículos seleccionados:\n\n';

        carrito.forEach((p, index) => {
            mensaje += (index + 1) + '. ' + (p.titulo || 'Sin título') + '\n';
            mensaje += '   Contado: ' + formatearPrecioWhatsApp(p.precio_contado) + '\n';
            if (p.pago_mes_2) {
                mensaje += '   2 Meses: ' + formatearPrecioWhatsApp(p.pago_mes_2) + '/mes (Enganche: ' + formatearPrecioWhatsApp(p.enganche_2) + ')\n';
            }
            if (p.pago_mes_3) {
                mensaje += '   3 Meses: ' + formatearPrecioWhatsApp(p.pago_mes_3) + '/mes (Enganche: ' + formatearPrecioWhatsApp(p.enganche_3) + ')\n';
            }
            if (p.pago_mes_6) {
                mensaje += '   6 Meses: ' + formatearPrecioWhatsApp(p.pago_mes_6) + '/mes (Enganche: ' + formatearPrecioWhatsApp(p.enganche_6) + ')\n';
            }
            if (p.pago_tarjeta_12) {
                mensaje += '   12 Meses (Tarjeta): ' + formatearPrecioWhatsApp(p.pago_tarjeta_12) + '\n';
            }
            mensaje += '\n';
        });

        mensaje += 'Gracias por su preferencia! Mueblería Daguerr.';

        abrirWhatsApp(telefono, mensaje);
    }

    // ============================================================
    // FORMATEAR PRECIO PARA WHATSAPP (SIN SÍMBOLOS EXTRAÑOS)
    // ============================================================
    function formatearPrecioWhatsApp(valor) {
        if (valor === null || valor === undefined || valor === '' || valor === 0) return 'Consultar';
        if (typeof valor === 'number') {
            return '$' + valor.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return valor;
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    async function inicializarProductos() {
      try {
        const { data, error } = await supabaseClient
          .from('productos')
          .select('*');

        if (error) {
          console.error('Error al cargar desde Supabase:', error);
          return;
        }

        productos = (data || []).filter(p => p.oculto !== true && p.oculto !== 'true');
        cargarCatalogo(productos);
        actualizarContadorCarrito();
      } catch (err) {
        console.error('Excepción al conectar con Supabase:', err);
      }
    }

    // ============================================================
    // UTILIDADES
    // ============================================================
    function formatearPrecio(valor) {
      if (valor === null || valor === undefined || valor === '' || valor === 0) return 'Consultar';
      if (typeof valor === 'number') {
        return `$${valor.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      }
      return valor;
    }

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.innerText = texto == null ? '' : texto;
      return div.innerHTML;
    }

    const normalizar = (texto) => (texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

    function obtenerBadgesHTML(estado) {
      if (estado === 'disponible') {
        return `<span class="badge-estado disponible">Disponible</span>`;
      } else if (estado === 'pedido') {
        return `
          <span class="badge-estado agotado">No disponible</span>
          <span class="badge-estado pedido">Por Pedido</span>
        `;
      } else {
        return `<span class="badge-estado agotado">No disponible</span>`;
      }
    }

    // ============================================================
    // CATÁLOGO
    // ============================================================
    function cargarCatalogo(lista = productos) {
      const catalogo = document.getElementById('contenedor-productos');
      if (!catalogo) return;
      catalogo.innerHTML = '';

      if (!lista || lista.length === 0) {
        const mensaje = terminoBusqueda
          ? `No encontramos articulos que coincidan con "${terminoBusqueda}". Intenta con otro nombre o revisa las categorias.`
          : `Proximamente tendremos productos disponibles en esta categoria. ¡Contactanos por WhatsApp para mas informacion!`;
        catalogo.innerHTML = `<div class="mensaje-vacio">${mensaje}</div>`;
        return;
      }

      lista.forEach((item, index) => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-mueble';
        tarjeta.style.animationDelay = `${index * 0.04}s`;
        tarjeta.onclick = () => abrirModal(item.id);

        const imgSrc = (item.imagenes && item.imagenes.length > 0) ? item.imagenes[0] : '';
        const totalFotos = (item.imagenes && item.imagenes.length > 1) ? item.imagenes.length : 0;
        const badgeFotosHTML = totalFotos > 1 ? `
          <div class="badge-fotos-contador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span>${totalFotos}</span>
          </div>
        ` : '';

        const precioContado = formatearPrecio(item.precio_contado);
        const precioHTML = precioContado !== 'Consultar'
          ? `<div class="precio-tarjeta"><span class="precio-tarjeta-etiqueta">Contado</span><span class="precio-tarjeta-valor">${precioContado}</span></div>`
          : `<div class="precio-tarjeta precio-tarjeta-consultar"><span class="precio-tarjeta-valor">Consultar precio</span></div>`;

        tarjeta.innerHTML = `
          <div class="contenedor-imagen-tarjeta">
            ${badgeFotosHTML}
            <img src="${imgSrc}" alt="${item.titulo || 'Mueble'}" class="imagen-mueble" loading="lazy">
          </div>
          <div class="info-mueble">
            <div class="contenedor-badges">
              ${obtenerBadgesHTML(item.estado)}
            </div>
            <h3>${item.titulo || ''}</h3>
            <p>${item.descripcion || ''}</p>
            ${precioHTML}
            <button class="btn-precios" onclick="event.stopPropagation(); abrirModal(${item.id})">Ver todos los planes</button>
          </div>
        `;
        catalogo.appendChild(tarjeta);
      });
    }

    function filtrarCategoria(cat, btn) {
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
      if (btn) btn.classList.add('activo');

      categoriaActiva = cat;
      subcategoriaActiva = null;

      const submenuLB = document.getElementById('submenuLineaBlanca');
      if (cat === 'Linea Blanca') {
        submenuLB.classList.add('activo');
        const primerSubBtn = submenuLB.querySelector('.btn-subfiltro');
        if (primerSubBtn) {
          filtrarSubcategoria(primerSubBtn.innerText, primerSubBtn);
        } else {
          aplicarFiltros();
        }
      } else {
        submenuLB.classList.remove('activo');
        aplicarFiltros();
      }
    }

    function filtrarSubcategoria(subcat, btn) {
      document.querySelectorAll('.btn-subfiltro').forEach(b => b.classList.remove('activo'));
      if (btn) btn.classList.add('activo');

      subcategoriaActiva = subcat;
      aplicarFiltros();
    }

    function aplicarFiltros() {
      let base = productos;

      if (categoriaActiva && categoriaActiva !== 'Todos') {
        base = base.filter(p => normalizar(p.categoria) === normalizar(categoriaActiva));
        if (categoriaActiva === 'Linea Blanca' && subcategoriaActiva) {
          base = base.filter(p => normalizar(p.subcategoria) === normalizar(subcategoriaActiva));
        }
      }

      if (terminoBusqueda) {
        const termino = normalizar(terminoBusqueda);
        base = base.filter(p => normalizar(p.titulo).includes(termino));
      }

      cargarCatalogo(base);
    }

    function buscarProductos(valor) {
      terminoBusqueda = valor.trim();
      const caja = document.getElementById('buscadorCaja');
      if (caja) caja.classList.toggle('tiene-texto', terminoBusqueda.length > 0);
      aplicarFiltros();
    }

    function limpiarBusqueda() {
      const campo = document.getElementById('campoBusqueda');
      if (campo) campo.value = '';
      buscarProductos('');
      if (campo) campo.focus();
    }

    function limpiarFiltros() {
      limpiarBusqueda();
      document.getElementById('submenuLineaBlanca').classList.remove('activo');
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
      const btnTodos = document.querySelector('.btn-filtro[onclick*="\'Todos\'"]');
      filtrarCategoria('Todos', btnTodos);
    }

    // ============================================================
    // MODAL PRODUCTO
    // ============================================================
    function abrirModal(id) {
      productoActual = productos.find(p => p.id == id);
      if (!productoActual) return;

      indiceImagenActual = 0;
      actualizarImagenModal();

      document.getElementById('modal-titulo').innerText = productoActual.titulo || '';
      document.getElementById('modal-descripcion').innerText = productoActual.descripcion || '';
      document.getElementById('modal-estado-contenedor').innerHTML = obtenerBadgesHTML(productoActual.estado);

      document.getElementById('val-precio-contado').innerText = formatearPrecio(productoActual.precio_contado);
      document.getElementById('val-enganche-2').innerText = formatearPrecio(productoActual.enganche_2);
      document.getElementById('val-pago-mes-2').innerText = formatearPrecio(productoActual.pago_mes_2);
      document.getElementById('val-enganche-3').innerText = formatearPrecio(productoActual.enganche_3);
      document.getElementById('val-pago-mes-3').innerText = formatearPrecio(productoActual.pago_mes_3);
      document.getElementById('val-enganche-6').innerText = formatearPrecio(productoActual.enganche_6);
      document.getElementById('val-pago-mes-6').innerText = formatearPrecio(productoActual.pago_mes_6);
      document.getElementById('val-pago-tarjeta-12').innerText = formatearPrecio(productoActual.pago_tarjeta_12);

      document.getElementById('modal-producto').classList.add('activo');
      document.body.style.overflow = 'hidden';
    }

    function cerrarModal() {
      document.getElementById('modal-producto').classList.remove('activo');
      document.body.style.overflow = '';
    }

    function cambiarImagen(direccion) {
      if (!productoActual || !productoActual.imagenes || productoActual.imagenes.length <= 1) return;
      indiceImagenActual += direccion;
      if (indiceImagenActual < 0) { indiceImagenActual = productoActual.imagenes.length - 1; } 
      else if (indiceImagenActual >= productoActual.imagenes.length) { indiceImagenActual = 0; }
      actualizarImagenModal();
    }

    function actualizarImagenModal() {
      if (productoActual && productoActual.imagenes && productoActual.imagenes.length > 0) {
        document.getElementById('modal-img').src = productoActual.imagenes[indiceImagenActual];
        const imgGrande = document.getElementById('modal-img-grande');
        if (imgGrande && imgGrande.classList.contains('activo')) {
          document.getElementById('img-ampliada').src = productoActual.imagenes[indiceImagenActual];
          actualizarContadorImagenGrande();
        }
      }
    }

    function actualizarContadorImagenGrande() {
      const contador = document.getElementById('contador-imagen-grande');
      if (!contador || !productoActual || !productoActual.imagenes) return;
      const total = productoActual.imagenes.length;
      if (total > 1) {
        contador.textContent = `${indiceImagenActual + 1} / ${total}`;
        contador.style.display = 'block';
      } else {
        contador.style.display = 'none';
      }
    }

    function abrirImagenGrande() {
      if (!productoActual || !productoActual.imagenes) return;
      document.getElementById('img-ampliada').src = productoActual.imagenes[indiceImagenActual];
      document.getElementById('modal-img-grande').classList.add('activo');
      const hayVarias = productoActual.imagenes.length > 1;
      document.querySelectorAll('.btn-carrusel-grande').forEach(b => b.style.display = hayVarias ? 'flex' : 'none');
      actualizarContadorImagenGrande();
      document.body.style.overflow = 'hidden';
    }

    function cerrarImagenGrande() {
      document.getElementById('modal-img-grande').classList.remove('activo');
      document.body.style.overflow = '';
    }

    // ============================================================
    // CARRITO - AGREGAR
    // ============================================================
    function agregarACarrito() {
      if (!productoActual) return;

      const yaExiste = carrito.some(p => p.id == productoActual.id);
      if (yaExiste) {
        alert('Este artículo ya está en el carrito.');
        return;
      }

      carrito.push({
        id: productoActual.id,
        titulo: productoActual.titulo,
        precio_contado: productoActual.precio_contado,
        enganche_2: productoActual.enganche_2,
        pago_mes_2: productoActual.pago_mes_2,
        enganche_3: productoActual.enganche_3,
        pago_mes_3: productoActual.pago_mes_3,
        enganche_6: productoActual.enganche_6,
        pago_mes_6: productoActual.pago_mes_6,
        pago_tarjeta_12: productoActual.pago_tarjeta_12
      });

      actualizarContadorCarrito();
      
      const btn = document.querySelector('.btn-agregar-carrito');
      const textoOriginal = btn.innerHTML;
      btn.innerHTML = '✓ Agregado al carrito';
      setTimeout(() => { btn.innerHTML = textoOriginal; }, 1500);
    }

    function actualizarContadorCarrito() {
      const contador = document.getElementById('carritoContador');
      if (!contador) return;
      contador.innerText = carrito.length;
      contador.classList.toggle('visible', carrito.length > 0);
    }

    // ============================================================
    // CARRITO - MODAL
    // ============================================================
    function abrirCarrito() {
      renderizarCarrito();
      document.getElementById('modal-carrito').classList.add('activo');
      document.body.style.overflow = 'hidden';
    }

    function cerrarCarrito() {
      document.getElementById('modal-carrito').classList.remove('activo');
      document.body.style.overflow = '';
    }

    function renderizarCarrito() {
      const lista = document.getElementById('listaCarrito');
      if (!lista) return;

      if (carrito.length === 0) {
        lista.innerHTML = '<p class="carrito-vacio">No hay artículos en el carrito. Agrega productos desde el catálogo.</p>';
        return;
      }

      lista.innerHTML = carrito.map(p => `
        <div class="carrito-fila">
          <div class="carrito-fila-info">
            <span class="carrito-fila-titulo">${escaparHtml(p.titulo || 'Sin título')}</span>
            <span class="carrito-fila-precio">${formatearPrecio(p.precio_contado)} contado</span>
          </div>
          <button type="button" class="btn-quitar-carrito" aria-label="Quitar artículo" onclick="quitarDelCarrito(${p.id})">&times;</button>
        </div>
      `).join('');
    }

    function quitarDelCarrito(id) {
      carrito = carrito.filter(p => p.id != id);
      actualizarContadorCarrito();
      renderizarCarrito();
    }

    function vaciarCarrito() {
      if (carrito.length === 0) return;
      if (confirm('¿Vaciar el carrito por completo?')) {
        carrito = [];
        actualizarContadorCarrito();
        renderizarCarrito();
      }
    }

    // ============================================================
    // IMPRIMIR COTIZACIÓN
    // ============================================================
    function imprimirCotizacion() {
      if (carrito.length === 0) {
        alert('El carrito está vacío. Agrega artículos para imprimir una cotización.');
        return;
      }

      const hoy = new Date();
      document.getElementById('cot-fecha').innerText = hoy.toLocaleDateString('es-MX', {
        day: '2-digit', month: 'long', year: 'numeric'
      });

      const cuerpo = document.getElementById('cot-tabla-cuerpo');
      cuerpo.innerHTML = carrito.map(p => `
        <tr>
          <td class="cot-col-articulo">${escaparHtml(p.titulo || 'Sin título')}</td>
          <td>${formatearPrecio(p.precio_contado)}</td>
          <td>${p.pago_mes_2 ? formatearPrecio(p.pago_mes_2) + '/mes' : 'N/A'}${p.enganche_2 ? `<br><span class="cot-enganche">Enganche ${formatearPrecio(p.enganche_2)}</span>` : ''}</td>
          <td>${p.pago_mes_3 ? formatearPrecio(p.pago_mes_3) + '/mes' : 'N/A'}${p.enganche_3 ? `<br><span class="cot-enganche">Enganche ${formatearPrecio(p.enganche_3)}</span>` : ''}</td>
          <td>${p.pago_mes_6 ? formatearPrecio(p.pago_mes_6) + '/mes' : 'N/A'}${p.enganche_6 ? `<br><span class="cot-enganche">Enganche ${formatearPrecio(p.enganche_6)}</span>` : ''}</td>
          <td>${p.pago_tarjeta_12 ? formatearPrecio(p.pago_tarjeta_12) : 'N/A'}</td>
        </tr>
      `).join('');

      window.print();
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cerrarModal();
        cerrarCarrito();
        cerrarImagenGrande();
        return;
      }
      
      const imgGrande = document.getElementById('modal-img-grande');
      if (!imgGrande || !imgGrande.classList.contains('activo')) return;
      if (e.key === 'ArrowLeft') cambiarImagen(-1);
      else if (e.key === 'ArrowRight') cambiarImagen(1);
    });

    function alternarModoOscuro() {
      const body = document.body;
      body.classList.toggle('modo-oscuro');
      localStorage.setItem('modoOscuro', body.classList.contains('modo-oscuro') ? 'activado' : 'desactivado');
    }

    window.addEventListener('scroll', () => {
      const btnArriba = document.getElementById('btnVolverArriba');
      if (btnArriba) btnArriba.classList.toggle('visible', window.pageYOffset > 400);
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('modoOscuro') === 'activado') {
        document.body.classList.add('modo-oscuro');
        const switchElem = document.getElementById('switchModoOscuro');
        if (switchElem) switchElem.checked = true;
      }
      inicializarProductos();
    });
  </script>
</body>
</html>
