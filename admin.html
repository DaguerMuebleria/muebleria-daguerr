<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Mueblería Daguerr</title>
    <!-- Incluimos el cliente de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .login-container, .admin-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        .admin-container {
            max-width: 800px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: red;
            font-size: 14px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .logout-btn {
            background-color: #dc3545;
            width: auto;
            padding: 5px 10px;
            float: right;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="loginScreen" class="login-container">
        <h2>Iniciar Sesión</h2>
        <label for="userLogin">Usuario</label>
        <input type="text" id="userLogin" placeholder="Ingresa tu usuario (ej. admin)">
        
        <label for="passLogin">Contraseña</label>
        <input type="password" id="passLogin" placeholder="Ingresa tu contraseña">
        
        <p id="errorLogin" class="error">Usuario o contraseña incorrectos.</p>
        
        <button onclick="intentarLogin()">Entrar</button>
    </div>

    <!-- Pantalla de Administración (Oculta al inicio) -->
    <div id="adminScreen" class="admin-container" style="display: none;">
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
        <h2>Panel de Administración - Productos</h2>
        
        <div>
            <h3>Agregar Nuevo Producto</h3>
            <input type="text" id="nuevoTitulo" placeholder="Título del producto">
            <input type="text" id="nuevaCategoria" placeholder="Categoría">
            <button onclick="agregarProducto()">Guardar Producto</button>
        </div>

        <h3>Lista de Productos</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                <!-- Los datos se cargan dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        // CONFIGURA TUS CREDENCIALES DE SUPABASE AQUÍ
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Comprobar si ya hay una sesión activa al cargar la página
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                mostrarPanelAdmin();
            }
        });

        async function intentarLogin() {
            const usuarioIngresado = document.getElementById('userLogin').value.trim();
            const passIngresada = document.getElementById('passLogin').value.trim();

            // Convertimos el usuario ingresado al formato de correo interno
            const emailFicticio = `${usuarioIngresado}@muebleriadaguerr.local`;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailFicticio,
                password: passIngresada,
            });

            if (error) {
                document.getElementById('errorLogin').style.display = 'block';
                return;
            }

            document.getElementById('errorLogin').style.display = 'none';
            mostrarPanelAdmin();
        }

        function mostrarPanelAdmin() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'block';
            cargarArticulos();
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            document.getElementById('adminScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('userLogin').value = '';
            document.getElementById('passLogin').value = '';
        }

        async function cargarArticulos() {
            const { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Error al cargar productos:', error.message);
                return;
            }

            const tbody = document.getElementById('tablaProductos');
            tbody.innerHTML = '';

            data.forEach(producto => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${producto.id}</td>
                    <td>${producto.titulo}</td>
                    <td>${producto.categoria}</td>
                    <td><button onclick="eliminarProducto(${producto.id})" style="background-color:#dc3545; margin:0; padding:5px;">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function agregarProducto() {
            const titulo = document.getElementById('nuevoTitulo').value.trim();
            const categoria = document.getElementById('nuevaCategoria').value.trim();

            if (!titulo || !categoria) {
                alert('Por favor completa todos los campos');
                return;
            }

            const { error } = await supabaseClient
                .from('productos')
                .insert([{ titulo: titulo, categoria: categoria }]);

            if (error) {
                alert('Error al agregar: ' + error.message);
                return;
            }

            document.getElementById('nuevoTitulo').value = '';
            document.getElementById('nuevaCategoria').value = '';
            cargarArticulos();
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Estás seguro de eliminar este producto?')) return;

            const { error } = await supabaseClient
                .from('productos')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Error al eliminar: ' + error.message);
                return;
            }

            cargarArticulos();
        }
    </script>
</body>
</html>
