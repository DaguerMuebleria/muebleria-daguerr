<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mueblería Daguerr</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px; --primary: #0f172a; --primary-light: #1e293b;
            --accent: #3b82f6; --accent-hover: #2563eb; --success: #10b981;
            --danger: #ef4444; --warning: #f59e0b; --bg-color: #f1f5f9;
            --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --radius-md: 12px; --radius-lg: 16px;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; }
        
        /* Sidebar y Layout */
        aside { width: var(--sidebar-width); background: var(--primary); color: white; position: fixed; height: 100vh; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-brand { padding: 24px 20px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-menu { padding: 20px 12px; flex-grow: 1; overflow-y: auto; }
        .sidebar-btn-cat { width: 100%; background: transparent; border: none; color: #cbd5e1; padding: 10px 14px; text-align: left; border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 4px; }
        .sidebar-btn-cat.active { background: var(--accent); color: white; }
        
        main { margin-left: var(--sidebar-width); flex-grow: 1; padding: 30px 40px; width: calc(100% - var(--sidebar-width)); }
        
        /* Tarjetas */
        .products-grid { display: flex; flex-direction: column; gap: 12px; }
        .product-row { background: var(--card-bg); border: 1px solid var(--border); padding: 16px 20px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between; gap: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .product-thumb { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; background: #f8fafc; border: 1px solid var(--border); }
        .row-actions { display: flex; gap: 8px; }
        
        /* Modales */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-card { background: white; width: 100%; max-width: 500px; border-radius: var(--radius-lg); box-shadow: 0 25px 50px rgba(0,0,0,0.25); overflow: hidden; }
        .modal-header { padding: 20px 24px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 24px; }
        
        /* Estilo Precios Modal */
        .price-card { background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
        .price-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .btn-action { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .btn-price { background: #f1f5f9; color: #334155; }
        .btn-edit { background: #eff6ff; color: var(--accent); }
        .btn-delete { background: #fef2f2; color: var(--danger); }
        
        input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; }
    </style>
</head>
<body>

<aside id="appSidebar">
    <div class="sidebar-brand">Daguerr <span>Panel</span></div>
    <div class="sidebar-menu">
        <button class="sidebar-btn-cat active" onclick="filtrarCategoria('Todas', this)">📂 Todas</button>
        <button class="sidebar-btn-cat" onclick="filtrarCategoria('Linea Blanca', this)">⚡ Línea Blanca</button>
        <button class="sidebar-btn-cat" onclick="filtrarCategoria('Cocinas', this)">🍳 Cocinas</button>
        <button class="sidebar-btn-cat" onclick="filtrarCategoria('Salas', this)">🛋️ Salas</button>
    </div>
</aside>

<main>
    <header>
        <h1>Gestión de Inventario</h1>
        <button class="btn-primary-action" onclick="abrirModalNuevo()" style="background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">+ Nuevo Artículo</button>
    </header>
    <div class="products-grid" id="listaProductos"></div>
</main>

<!-- Modal de Precios -->
<div class="modal-overlay" id="modalPrecios">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Detalle de Financiamiento</h3>
            <button class="modal-close" onclick="document.getElementById('modalPrecios').style.display='none'" style="border:none; background:none; cursor:pointer; font-size:20px;">&times;</button>
        </div>
        <div class="modal-body" id="contenidoPrecios"></div>
    </div>
</div>

<!-- Modal Producto (Mantenemos tu lógica original) -->
<div class="modal-overlay" id="modalProducto">
    <!-- Contenido del modal original de edición aquí... -->
</div>

<script>
    const supabaseClient = supabase.createClient('https://sbuwwydygabgweegvzoi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidXd3eWR5Z2FiZ3dlZWd2em9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODgxOTksImV4cCI6MjEwMTM2NDE5OX0.D3iSUhyNx4CpB5xTqsfn4R5CFvyghpfzVvi_CxdnXPI');
    let productosGlobales = [];

    async function cargarArticulos() {
        const { data } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
        productosGlobales = data || [];
        renderizarLista(productosGlobales);
    }

    function renderizarLista(lista) {
        const contenedor = document.getElementById('listaProductos');
        contenedor.innerHTML = lista.map(prod => `
            <div class="product-row">
                <div style="display:flex; align-items:center; gap:15px;">
                    <img src="${(prod.imagenes && prod.imagenes[0]) || ''}" class="product-thumb">
                    <div>
                        <h3 style="margin:0; font-size:15px;">${prod.titulo}</h3>
                        <p style="margin:0; font-size:12px; color:var(--text-muted);">${prod.categoria}</p>
                    </div>
                </div>
                <div class="row-actions">
                    <button class="btn-action btn-price" onclick="abrirModalPrecios(${prod.id})">💰 Precios</button>
                    <button class="btn-action btn-edit" onclick="abrirModalEditar(${prod.id})">Editar</button>
                    <button class="btn-action btn-delete" onclick="eliminarProducto(${prod.id})">Eliminar</button>
                </div>
            </div>
        `).join('');
    }

    function abrirModalPrecios(id) {
        const prod = productosGlobales.find(p => p.id === id);
        const cont = document.getElementById('contenidoPrecios');
        cont.innerHTML = `
            <div class="price-card">
                <h4 style="margin-top:0;">${prod.titulo}</h4>
                <div class="price-row"><span>Precio Contado:</span> <b>$${prod.precio_contado || 0}</b></div>
                <hr>
                <div class="price-row"><span>Enganche (3m):</span> <b>$${prod.enganche_3 || 0}</b></div>
                <div class="price-row"><span>Pago mensual (3m):</span> <b>$${prod.pago_mes_3 || 0}</b></div>
                <hr>
                <div class="price-row"><span>Enganche (6m):</span> <b>$${prod.enganche_6 || 0}</b></div>
                <div class="price-row"><span>Pago mensual (6m):</span> <b>$${prod.pago_mes_6 || 0}</b></div>
                <hr>
                <div class="price-row"><span>Pago Tarjeta (12m):</span> <b>$${prod.pago_tarjeta_12 || 0}</b></div>
            </div>
        `;
        document.getElementById('modalPrecios').style.display = 'flex';
    }

    window.onload = cargarArticulos;
</script>
</body>
</html>
