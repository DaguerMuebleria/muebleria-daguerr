<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mueblería Daguerr</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Botón de Menú Móvil (Hamburguesa) */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 101;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* Sidebar Moderno */
        aside {
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-brand {
            padding: 24px 20px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span {
            color: var(--accent);
        }

        .sidebar-menu {
            padding: 20px 12px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            padding: 0 12px 10px;
            font-weight: 600;
        }

        .sidebar-btn-cat {
            width: 100%;
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 10px 14px;
            text-align: left;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-btn-cat:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        .sidebar-btn-cat.active {
            background: var(--accent);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .btn-logout-side {
            width: 100%;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout-side:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            backdrop-filter: blur(2px);
        }

        /* Main Content Layout */
        main {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 30px 40px;
            width: calc(100% - var(--sidebar-width));
            transition: margin 0.3s ease, width 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .header-title p {
            margin: 4px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary-action:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 14px;
            outline: none;
            background: white;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
        }

        /* Cards list layout */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .product-row:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow);
        }

        .product-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-grow: 1;
            min-width: 0;
        }

        .product-thumb {
            width: 55px;
            height: 55px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: #f8fafc;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .product-info {
            min-width: 0;
            flex-grow: 1;
        }

        .product-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-info p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.disponible { background: var(--success-light); color: var(--success); }
        .badge.pedido { background: var(--warning-light); color: var(--warning); }
        .badge.agotado { background: var(--danger-light); color: var(--danger); }

        .row-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-action {
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-edit { background: #eff6ff; color: var(--accent); border-color: #bfdbfe; }
        .btn-edit:hover { background: var(--accent); color: white; }

        .btn-delete { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Modal Rediseñado Ejecutivo */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 620px;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: modalFadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes modalFadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            padding: 20px 24px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--primary); }
        
        .modal-close {
            background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted);
        }
        .modal-close:hover { color: var(--text-main); }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .modal-footer {
            padding: 16px 24px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; color: var(--primary-light); }
        label:first-of-type { margin-top: 0; }

        input[type="text"], input[type="number"], input[type="url"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            background: white;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea { resize: vertical; height: 80px; }

        .dropzone-box {
            border: 2px dashed #cbd5e1;
            padding: 20px;
            text-align: center;
            border-radius: var(--radius-sm);
            background: #f8fafc;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        .dropzone-box:hover { border-color: var(--accent); background: #f0fdf4; }

        /* Contenedor de Previsualización y Reordenamiento de Imágenes */
        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .preview-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            gap: 10px;
        }
        .preview-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .preview-thumb {
            width: 50px; height: 50px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: #f1f5f9; flex-shrink: 0;
        }
        .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .preview-url-text {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }
        .preview-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .btn-img-action {
            background: white;
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s;
        }
        .btn-img-action:hover { background: #e2e8f0; }
        .btn-img-delete {
            background: #fef2f2;
            color: var(--danger);
            border-color: #fecaca;
        }
        .btn-img-delete:hover { background: var(--danger); color: white; }

        .btn-suburl {
            background: transparent; color: var(--accent); border: 1px dashed var(--accent); padding: 8px; border-radius: var(--radius-sm); cursor: pointer; margin-top: 8px; font-size: 12px; font-weight: 600; width: 100%;
            transition: background 0.2s;
        }
        .btn-suburl:hover { background: #eff6ff; }

        .btn-modal-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-modal-save:hover { background: #059669; }

        .btn-modal-cancel { background: #e2e8f0; color: var(--text-muted); border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-modal-cancel:hover { background: #cbd5e1; color: var(--text-main); }

        .oculto { display: none; }
        #msgLoader { font-size: 13px; font-weight: 600; margin-top: 10px; text-align: center; color: var(--accent); }

        /* Login Pantalla Completa */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px;
        }
        .login-card {
            background: white; padding: 40px; border-radius: var(--radius-lg); width: 100%; max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); text-align: center;
        }
        .login-card h2 { margin: 0 0 5px 0; color: var(--primary); font-size: 22px; }
        .login-card input { width: 100%; padding: 12px; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .btn-login-action {
            background: var(--accent); color: white; border: none; padding: 12px; width: 100%;
            border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s;
        }
        .btn-login-action:hover { background: var(--accent-hover); }
        .login-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; font-weight: 500; }

        /* --- MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            aside { transform: translateX(-100%); }
            aside.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            main { margin-left: 0; width: 100%; padding: 20px 15px; padding-top: 70px; }
            .product-row { flex-direction: column; align-items: stretch; gap: 12px; padding: 14px; }
            .product-meta { width: 100%; align-items: center; }
            .product-info h3 { white-space: normal; word-break: break-word; }
            .row-actions { width: 100%; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
            .action-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<button class="mobile-menu-btn" onclick="toggleMenuMobil()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenuMobil()"></div>

<div id="loginScreen">
    <div class="login-card">
        <h2>Panel Administrativo</h2>
        <input type="text" id="userLogin" placeholder="Usuario">
        <input type="password" id="passLogin" placeholder="Contraseña">
        <button class="btn-login-action" onclick="intentarLogin()">Acceder al Sistema</button>
        <div id="errorLogin" class="login-error">Credenciales incorrectas</div>
    </div>
</div>

<aside id="appSidebar">
    <div class="sidebar-brand">Daguerr <span>Panel</span></div>
    <div class="sidebar-menu">
        <div class="menu-label">Categorías</div>
        <button class="sidebar-btn-cat active" onclick="filtrarCategoria('Todas', this)">📂 Todas</button>
        <!-- Categorías aquí -->
    </div>
    <div class="sidebar-footer">
        <button class="btn-logout-side" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</aside>

<main>
    <header>
        <div class="header-title">
            <h1>Gestión de Inventario</h1>
        </div>
    </header>

    <div class="action-bar">
        <button class="btn-primary-action" onclick="abrirModalNuevo()">+ Nuevo Artículo</button>
        <div class="search-box">
            <input type="text" id="inputBuscador" placeholder="Buscar por título o ID..." oninput="filtrarPorBusqueda()">
        </div>
    </div>

    <div class="products-grid" id="listaProductos">
        <p style="text-align: center; color: var(--text-muted); padding: 40px;">Cargando...</p>
    </div>
</main>

<div class="modal-overlay" id="modalProducto">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitulo">Nuevo Artículo</h3>
            <button class="modal-close" onclick="cerrarModal()">&times;</button>
        </div>
        <div class="modal-body">
            <!-- Campos del formulario -->
            <label>Título:</label>
            <input type="text" id="inputTitulo">
            
            <label>Categoría:</label>
            <select id="inputCategoria" onchange="verificarLineaBlancaModal()">
                <option value="Cocinas">Cocinas</option>
                <!-- Opciones -->
            </select>
            
            <div id="grupoSubModal" class="oculto">
                <label>Subcategoría:</label>
                <select id="inputSubcategoria">
                    <option value="">Selecciona...</option>
                </select>
            </div>

            <label>Descripción:</label>
            <textarea id="inputDescripcion"></textarea>

            <label>Imágenes:</label>
            <div class="dropzone-box" onclick="document.getElementById('fileInput').click()">
                <p>📁 Arrastra o haz clic</p>
            </div>
            <input type="file" id="fileInput" class="oculto" multiple onchange="subirArchivosASupabase(this.files)">
            <div class="preview-list" id="previewContainer"></div>
            
            <div id="msgLoader"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-modal-save" onclick="guardarProducto()">Guardar</button>
        </div>
    </div>
</div>

<script>
    // Configuración base de Supabase (mantenida de tu código)
    const SUPABASE_URL = 'https://sbuwwydygabgweegvzoi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Asegúrate de tener tu key real
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // [Tu lógica JavaScript existente...]
    
    // Nueva función para manejar el cambio en Linea Blanca y ocultar/mostrar la subcategoría
    function verificarLineaBlancaModal() {
        const categoriaSeleccionada = document.getElementById('inputCategoria').value;
        const contenedorSubcategoria = document.getElementById('grupoSubModal');
        
        if (categoriaSeleccionada === 'Linea Blanca') {
            contenedorSubcategoria.classList.remove('oculto');
        } else {
            contenedorSubcategoria.classList.add('oculto');
            // Opcional: limpiar la selección si cambia la categoría
            document.getElementById('inputSubcategoria').value = '';
        }
    }
</script>

</body>
</html>
