<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administracion - Muebleria Daguerr</title>
    <!-- Libreria de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        
        .btn-nuevo { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: block; margin: 0 auto 20px auto; }
        .btn-nuevo:hover { background: #219653; }

        .categorias-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .tab-btn { background: #ecf0f1; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; }
        .tab-btn.active { background: #2980b9; color: white; }

        .producto-card { display: flex; justify-content: space-between; align-items: center; background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 12px; gap: 15px; }
        .producto-info { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .producto-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #ddd; }
        .producto-detalles h3 { margin: 0 0 5px 0; font-size: 16px; color: #2c3e50; }
        .producto-detalles p { margin: 0; font-size: 13px; color: #7f8c8d; }
        
        .acciones { display: flex; gap: 8px; }
        .btn-editar { background: #f39c12; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-eliminar { background: #c0392b; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-editar:hover { background: #d68910; }
        .btn-eliminar:hover { background: #a93226; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h2 { margin-top: 0; color: #2c3e50; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { resize: vertical; height: 70px; }
        
        .drop-zone { border: 2px dashed #3498db; padding: 20px; text-align: center; border-radius: 8px; background: #ecf0f1; cursor: pointer; margin-top: 5px; }
        .drop-zone:hover { background: #d0d7de; }

        .preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-item { position: relative; width: 70px; height: 70px; border-radius: 6px; overflow: hidden; border: 1px solid #ccc; background: #eee; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }

        .btn-add-url { background: #2980b9; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 5px; font-size: 12px; }
        
        .modal-botones { display: flex; gap: 10px; margin-top: 20px; }
        .btn-guardar { background: #27ae60; color: white; border: none; padding: 12px; flex: 1; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-cancelar { background: #7f8c8d; color: white; border: none; padding: 12px; flex: 1; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        .oculto { display: none; }
        #mensajeCarga { text-align: center; font-weight: bold; margin-top: 15px; color: #2980b9; }

        /* Estilos del Login y Botón de Salir */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); text-align: center;
        }
        .login-box h2 { margin-bottom: 20px; color: #2c3e50; }
        .login-box input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-login { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-login:hover { background: #219653; }
        .error-login { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
        .btn-salir { background: #c0392b; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; float: right; }
    </style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="loginOverlay">
    <div class="login-box">
        <h2>Panel Administrativo</h2>
        <p style="font-size: 13px; color: #7f8c8d;">Mueblería Daguerr</p>
        <input type="text" id="userLogin" placeholder="Usuario">
        <input type="password" id="passLogin" placeholder="Contraseña">
        <button class="btn-login" onclick="intentarLogin()">Ingresar</button>
        <div id="errorLogin" class="error-login">Usuario o contraseña incorrectos</div>
    </div>
</div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0; flex-grow: 1; text-align: center;">Panel de Control - Mueblería Daguerr</h1>
        <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
    
    <button class="btn-nuevo" onclick="abrirModalNuevo()">+ Agregar Nuevo Artículo</button>

    <!-- Barra de Búsqueda Rápida -->
    <div style="margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto;">
        <input type="text" id="inputBuscador" placeholder="🔍 Buscar por nombre o ID de artículo..." oninput="filtrarPorBusqueda()" style="width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #bdc3c7; font-size: 14px;">
    </div>

    <div class="categorias-tabs" id="tabsCategorias">
        <button class="tab-btn active" onclick="filtrarCategoria('Todas', this)">Todas</button>
        <button class="tab-btn" onclick="filtrarCategoria('Cocinas', this)">Cocinas</button>
        <button class="tab-btn" onclick="filtrarCategoria('Linea Blanca', this)">Línea Blanca</button>
        <button class="tab-btn" onclick="filtrarCategoria('Comedores', this)">Comedores</button>
        <button class="tab-btn" onclick="filtrarCategoria('Tubulares', this)">Tubulares</button>
        <button class="tab-btn" onclick="filtrarCategoria('Salas', this)">Salas</button>
        <button class="tab-btn" onclick="filtrarCategoria('Recamaras', this)">Recámaras</button>
        <button class="tab-btn" onclick="filtrarCategoria('Closet', this)">Closet</button>
        <button class="tab-btn" onclick="filtrarCategoria('Colchoneria', this)">Colchonería</button>
        <button class="tab-btn" onclick="filtrarCategoria('Deportivos', this)">Deportivos</button>
        <button class="tab-btn" onclick="filtrarCategoria('Descanso', this)">Descanso</button>
        <button class="tab-btn" onclick="filtrarCategoria('Hogar', this)">Hogar</button>
        <button class="tab-btn" onclick="filtrarCategoria('Ropa y Calzado', this)">Ropa y Calzado</button>
    </div>

    <div id="listaProductos">
        <p style="text-align: center; color: #7f8c8d;">Cargando artículos...</p>
    </div>
</div>

<div class="modal" id="modalProducto">
    <div class="modal-content">
        <h2 id="modalTitulo">Nuevo Artículo</h2>
        
        <label>ID del Artículo:</label>
        <input type="number" id="inputCustomId" placeholder="Ej. 105 (Dejar en blanco si es autoincrementable)">

        <input type="hidden" id="productoIdOriginal">

        <label>Título del Artículo:</label>
        <input type="text" id="inputTitulo" placeholder="Ej. Sala Esquinera Roma">

        <label>Categoría:</label>
        <select id="inputCategoria" onchange="verificarLineaBlancaModal()">
            <option value="Cocinas">Cocinas</option>
            <option value="Linea Blanca">Línea Blanca</option>
            <option value="Comedores">Comedores</option>
            <option value="Tubulares">Tubulares</option>
            <option value="Salas">Salas</option>
            <option value="Recamaras">Recámaras</option>
            <option value="Closet">Closet</option>
            <option value="Colchoneria">Colchonería</option>
            <option value="Deportivos">Deportivos</option>
            <option value="Descanso">Descanso</option>
            <option value="Hogar">Hogar</option>
            <option value="Ropa y Calzado">Ropa y Calzado</option>
        </select>

        <div id="grupoSubModal" class="oculto">
            <label>Subcategoría:</label>
            <select id="inputSubcategoria">
                <option value="">Selecciona subcategoría...</option>
                <option value="Refrigeradores">Refrigeradores</option>
                <option value="Estufas">Estufas</option>
                <option value="Lavadoras">Lavadoras</option>
                <option value="Boilers">Boilers</option>
                <option value="Abanicos/AC">Abanicos/AC</option>
            </select>
        </div>

        <label>Estado:</label>
        <select id="inputEstado">
            <option value="disponible">Disponible</option>
            <option value="pedido">Bajo Pedido</option>
            <option value="agotado">Agotado</option>
        </select>

        <label>Descripción:</label>
        <textarea id="inputDescripcion" placeholder="Medidas, materiales, detalles..."></textarea>

        <label>Agregar Imágenes (Arrastra o haz clic):</label>
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p style="margin: 0; color: #2980b9; font-weight: bold;">📁 Arrastra tus fotos aquí o haz clic para seleccionarlas</p>
        </div>
        <input type="file" id="fileInput" class="oculto" accept="image/*" multiple onchange="subirArchivosASupabase(this.files)">

        <div class="preview-container" id="previewContainer"></div>

        <label style="margin-top: 15px;">Enlaces de Imágenes (URLs automáticas o manuales):</label>
        <div id="contenedorUrls">
            <input type="url" class="input-url" placeholder="https://ejemplo.com/foto1.jpg" style="margin-top:5px;">
        </div>
        <button type="button" class="btn-add-url" onclick="agregarCampoUrl()">+ Agregar campo de URL manual</button>

        <div id="mensajeCarga"></div>

        <div class="modal-botones">
            <button class="btn-guardar" onclick="guardarProducto()">Guardar Artículo</button>
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
  const SUPABASE_URL = 'https://sbuwwydygabgweegvzoi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidXd3eWR5Z2FiZ3dlZWd2em9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODgxOTksImV4cCI6MjEwMTM2NDE5OX0.D3iSUhyNx4CpB5xTqsfn4R5CFvyghpfzVvi_CxdnXPI';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let productosGlobales = [];
  let categoriaActual = 'Todas';

  document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('daguerr_auth') === 'true') {
          document.getElementById('loginOverlay').style.display = 'none';
      }
      cargarArticulos();
      configurarDragAndDrop();
  });

  function intentarLogin() {
      const usuarioIngresado = document.getElementById('userLogin').value.trim();
      const passIngresada = document.getElementById('passLogin').value.trim();

      if (usuarioIngresado === 'admin' && passIngresada === 'davilaguerrero60') {
          localStorage.setItem('daguerr_auth', 'true');
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('errorLogin').style.display = 'none';
      } else {
          document.getElementById('errorLogin').style.display = 'block';
      }
  }

  function cerrarSesion() {
      localStorage.removeItem('daguerr_auth');
      location.reload();
  }

  async function cargarArticulos() {
      const { data, error } = await supabaseClient
          .from('productos')
          .select('*')
          .order('id', { ascending: false });

      if (error) {
          console.error(error);
          document.getElementById('listaProductos').innerHTML = '<p style="color:red; text-align:center;">Error al cargar los artículos.</p>';
          return;
      }

      productosGlobales = data || [];
      mostrarProductosFiltrados();
  }

  function filtrarCategoria(cat, elementoBtn) {
      categoriaActual = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      elementoBtn.classList.add('active');
      document.getElementById('inputBuscador').value = '';
      mostrarProductosFiltrados();
  }

  function filtrarPorBusqueda() {
      const textoBusqueda = document.getElementById('inputBuscador').value.toLowerCase().trim();
      const contenedor = document.getElementById('listaProductos');

      let filtrados = productosGlobales;
      if (categoriaActual !== 'Todas') {
          filtrados = productosGlobales.filter(p => p.categoria === categoriaActual);
      }

      if (textoBusqueda !== '') {
          filtrados = filtrados.filter(p => {
              const tituloMatch = p.titulo && p.titulo.toLowerCase().includes(textoBusqueda);
              const idMatch = p.id && p.id.toString().includes(textoBusqueda);
              return tituloMatch || idMatch;
          });
      }

      if (filtrados.length === 0) {
          contenedor.innerHTML = '<p style="text-align: center; color: #7f8c8d; margin-top: 30px;">No se encontraron artículos con esa búsqueda.</p>';
          return;
      }

      let html = '';
      filtrados.forEach(prod => {
          let primeraImg = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes[0] : 'https://via.placeholder.com/60?text=Sin+Foto';
          let subText = prod.subcategoria ? ` | <b>Sub:</b> ${prod.subcategoria}` : '';

          html += `
              <div class="producto-card">
                  <div class="producto-info">
                      <img src="${primeraImg}" class="producto-img" onerror="this.src='https://via.placeholder.com/60?text=Error'">
                      <div class="producto-detalles">
                          <h3>[ID: ${prod.id}] ${prod.titulo}</h3>
                          <p><b>Cat:</b> ${prod.categoria}${subText} | <b>Estado:</b> ${prod.estado}</p>
                      </div>
                  </div>
                  <div class="acciones">
                      <button class="btn-editar" onclick="abrirModalEditar(${prod.id})">Editar</button>
                      <button class="btn-eliminar" onclick="eliminarProducto(${prod.id})">Eliminar</button>
                  </div>
              </div>
          `;
      });

      contenedor.innerHTML = html;
  }

  function mostrarProductosFiltrados() {
      document.getElementById('inputBuscador').value = '';
      const contenedor = document.getElementById('listaProductos');
      let filtrados = productosGlobales;
      if (categoriaActual !== 'Todas') {
          filtrados = productosGlobales.filter(p => p.categoria === categoriaActual);
      }

      if (filtrados.length === 0) {
          contenedor.innerHTML = '<p style="text-align: center; color: #7f8c8d; margin-top: 30px;">No hay artículos en esta categoría.</p>';
          return;
      }

      let html = '';
      filtrados.forEach(prod => {
          let primeraImg = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes[0] : 'https://via.placeholder.com/60?text=Sin+Foto';
          let subText = prod.subcategoria ? ` | <b>Sub:</b> ${prod.subcategoria}` : '';

          html += `
              <div class="producto-card">
                  <div class="producto-info">
                      <img src="${primeraImg}" class="producto-img" onerror="this.src='https://via.placeholder.com/60?text=Error'">
                      <div class="producto-detalles">
                          <h3>[ID: ${prod.id}] ${prod.titulo}</h3>
                          <p><b>Cat:</b> ${prod.categoria}${subText} | <b>Estado:</b> ${prod.estado}</p>
                      </div>
                  </div>
                  <div class="acciones">
                      <button class="btn-editar" onclick="abrirModalEditar(${prod.id})">Editar</button>
                      <button class="btn-eliminar" onclick="eliminarProducto(${prod.id})">Eliminar</button>
                  </div>
              </div>
          `;
      });

      contenedor.innerHTML = html;
  }

  function abrirModalNuevo() {
      document.getElementById('modalTitulo').textContent = 'Agregar Nuevo Artículo';
      document.getElementById('inputCustomId').value = '';
      document.getElementById('productoIdOriginal').value = '';
      document.getElementById('inputTitulo').value = '';
      document.getElementById('inputCategoria').value = 'Cocinas';
      document.getElementById('inputSubcategoria').value = '';
      document.getElementById('inputEstado').value = 'disponible';
      document.getElementById('inputDescripcion').value = '';
      document.getElementById('contenedorUrls').innerHTML = '<input type="url" class="input-url" placeholder="https://ejemplo.com/foto1.jpg" style="margin-top:5px;">';
      document.getElementById('previewContainer').innerHTML = '';
      document.getElementById('mensajeCarga').textContent = '';
      
      verificarLineaBlancaModal();
      document.getElementById('modalProducto').style.display = 'flex';
  }

  function abrirModalEditar(id) {
      const prod = productosGlobales.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('modalTitulo').textContent = 'Editar Artículo';
      document.getElementById('inputCustomId').value = prod.id;
      document.getElementById('productoIdOriginal').value = prod.id;
      document.getElementById('inputTitulo').value = prod.titulo || '';
      document.getElementById('inputCategoria').value = prod.categoria || 'Cocinas';
      document.getElementById('inputSubcategoria').value = prod.subcategoria || '';
      document.getElementById('inputEstado').value = prod.estado || 'disponible';
      document.getElementById('inputDescripcion').value = prod.descripcion || '';
      
      verificarLineaBlancaModal();

      const contenedorUrls = document.getElementById('contenedorUrls');
      contenedorUrls.innerHTML = '';
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = '';

      if (prod.imagenes && prod.imagenes.length > 0) {
          prod.imagenes.forEach(url => {
              contenedorUrls.innerHTML += `<input type="url" class="input-url" value="${url}" style="margin-top:5px;">`;
              previewContainer.innerHTML += `<div class="preview-item"><img src="${url}"></div>`;
          });
      } else {
          contenedorUrls.innerHTML = `<input type="url" class="input-url" placeholder="https://ejemplo.com/foto1.jpg" style="margin-top:5px;">`;
      }

      document.getElementById('mensajeCarga').textContent = '';
      document.getElementById('modalProducto').style.display = 'flex';
  }

  function cerrarModal() {
      document.getElementById('modalProducto').style.display = 'none';
  }

  function agregarCampoUrl() {
      document.getElementById('contenedorUrls').innerHTML += `<input type="url" class="input-url" placeholder="https://ejemplo.com/foto.jpg" style="margin-top:5px;">`;
  }

  function verificarLineaBlancaModal() {
      const cat = document.getElementById('inputCategoria').value;
      const grupoSub = document.getElementById('grupoSubModal');
      if (cat === 'Linea Blanca') {
          grupoSub.classList.remove('oculto');
      } else {
          grupoSub.classList.add('oculto');
          document.getElementById('inputSubcategoria').value = '';
      }
  }

  function configurarDragAndDrop() {
      const dropZone = document.querySelector('.drop-zone');
      ['dragenter', 'dragover'].forEach(eventName => {
          dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.style.background = '#d0d7de'; }, false);
      });
      ['dragleave', 'drop'].forEach(eventName => {
          dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.style.background = '#ecf0f1'; }, false);
      });
      dropZone.addEventListener('drop', (e) => {
          const dt = e.dataTransfer;
          const files = dt.files;
          subirArchivosASupabase(files);
      });
  }

  async function subirArchivosASupabase(files) {
      if (files.length === 0) return;

      const tituloArticulo = document.getElementById('inputTitulo').value.trim();
      if (!tituloArticulo) {
          alert('Por favor, escribe primero el "Título del Artículo" antes de subir imágenes para organizar las carpetas.');
          return;
      }

      const categoria = document.getElementById('inputCategoria').value;
      const subcategoria = document.getElementById('inputSubcategoria').value;

      const msg = document.getElementById('mensajeCarga');
      msg.style.color = '#2980b9';
      msg.textContent = `Subiendo ${files.length} imagen(es) a Supabase Storage...`;

      const contenedorUrls = document.getElementById('contenedorUrls');
      const previewContainer = document.getElementById('previewContainer');
      
      const inputsActuales = contenedorUrls.querySelectorAll('.input-url');
      if (inputsActuales.length === 1 && inputsActuales[0].value.trim() === '') {
          contenedorUrls.innerHTML = '';
      }

      const limpiarRuta = (texto) => texto.trim().replace(/[\/\\?%*:|"<>]/g, '_').replace(/\s+/g, '_');

      let catClean = limpiarRuta(categoria);
      let subClean = subcategoria ? limpiarRuta(subcategoria) : '';
      let titleClean = limpiarRuta(tituloArticulo);

      for (let i = 0; i < files.length; i++) {
          let file = files[i];
          let fileExt = file.name.split('.').pop();
          let fileNameUnique = `${Date.now()}_${i}.${fileExt}`;

          let rutaCarpeta = subClean ? `${catClean}/${subClean}/${titleClean}` : `${catClean}/${titleClean}`;
          let rutaCompleta = `${rutaCarpeta}/${fileNameUnique}`;

          try {
              let { data, error } = await supabaseClient.storage
                  .from('fotos-productos')
                  .upload(rutaCompleta, file, { upsert: true });

              if (error) {
                  console.error("Error al subir a Supabase Storage:", error);
                  alert("Error al subir imagen: " + error.message);
                  continue;
              }

              let { data: urlData } = supabaseClient.storage
                  .from('fotos-productos')
                  .getPublicUrl(rutaCompleta);

              if (urlData && urlData.publicUrl) {
                  let pubUrl = urlData.publicUrl;

                  let nuevoInput = document.createElement('input');
                  nuevoInput.type = 'url';
                  nuevoInput.className = 'input-url';
                  nuevoInput.value = pubUrl;
                  nuevoInput.style.marginTop = '5px';
                  contenedorUrls.appendChild(nuevoInput);

                  let previewItem = document.createElement('div');
                  previewItem.className = 'preview-item';
                  previewItem.innerHTML = `<img src="${pubUrl}">`;
                  previewContainer.appendChild(previewItem);
              }
          } catch (err) {
              console.error(err);
          }
      }

      msg.style.color = 'green';
      msg.textContent = '¡Imágenes subidas y carpetas creadas con éxito!';
      setTimeout(() => { msg.textContent = ''; }, 3000);
  }

  async function guardarProducto() {
      const idOriginal = document.getElementById('productoIdOriginal').value;
      const customIdVal = document.getElementById('inputCustomId').value.trim();
      const titulo = document.getElementById('inputTitulo').value.trim();
      const categoria = document.getElementById('inputCategoria').value;
      const subcategoria = document.getElementById('inputSubcategoria').value;
      const estado = document.getElementById('inputEstado').value;
      const descripcion = document.getElementById('inputDescripcion').value.trim();

      if (!titulo) {
          alert('Por favor escribe un título para el artículo.');
          return;
      }

      let imagenes = [];
      document.querySelectorAll('.input-url').forEach(input => {
          if (input.value.trim() !== '') {
              imagenes.push(input.value.trim());
          }
      });

      document.getElementById('mensajeCarga').style.color = '#2980b9';
      document.getElementById('mensajeCarga').textContent = 'Guardando datos en la base de datos...';

      let datosAEnviar = { 
          titulo, 
          categoria, 
          subcategoria: subcategoria || null, 
          estado, 
          descripcion, 
          imagenes 
      };

      if (customIdVal !== '') {
          datosAEnviar.id = parseInt(customIdVal);
      }

      let errorDb;
      if (idOriginal) {
          const { error } = await supabaseClient
              .from('productos')
              .update(datosAEnviar)
              .eq('id', idOriginal);
          errorDb = error;
      } else {
          const { error } = await supabaseClient
              .from('productos')
              .insert([datosAEnviar]);
          errorDb = error;
      }

      if (errorDb) {
          console.error(errorDb);
          document.getElementById('mensajeCarga').style.color = 'red';
          document.getElementById('mensajeCarga').textContent = 'Hubo un error al guardar: ' + (errorDb.message || '');
          return;
      }

      document.getElementById('mensajeCarga').style.color = 'green';
      document.getElementById('mensajeCarga').textContent = '¡Guardado con éxito!';
      
      setTimeout(() => {
          cerrarModal();
          cargarArticulos();
      }, 1000);
  }

  async function eliminarProducto(id) {
      if (!confirm('¿Estás seguro de que deseas eliminar este artículo?')) return;

      const { error } = await supabaseClient
          .from('productos')
          .delete()
          .eq('id', id);

      if (error) {
          console.error(error);
          alert('No se pudo eliminar el artículo.');
          return;
      }

      cargarArticulos();
  }
</script>
